services:
  - type: web
    name: current-market
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    # A single always-on instance owns this durable ledger and background loop.
    disk:
      name: paper-portfolio
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: CACHE_TTL_MS
        value: "300000"
      - key: STALE_TTL_MS
        value: "1800000"
      - key: UPSTREAM_TIMEOUT_MS
        value: "8000"
      - key: RATE_LIMIT_PER_MINUTE
        value: "90"
      - key: PAPER_TRADING_ENABLED
        value: "true"
      - key: PAPER_STATE_PATH
        value: /app/data/paper-portfolio.json
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_DATA_FEED
        value: iex
